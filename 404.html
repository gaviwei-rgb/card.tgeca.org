<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--coral:#f6816c;--vh:1vh;--pad:12px;--gap:12px;--bar:48px}
@supports (height:1dvh){:root{--vh:1dvh}}
/* 整個 body（名片 + 按鈕）= 裝置高度 90%；名片維持 9:16，高度取「剩餘高度」與「寬度允許的高度」較小者 */
:root{--h:min(calc(90 * var(--vh) - 2 * var(--pad) - var(--gap) - var(--bar)), calc((100vw - 2 * var(--pad)) * 16 / 9))}
*{box-sizing:border-box}
body{margin:0;height:calc(90 * var(--vh));background:#e9ecf0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap);padding:var(--pad);font-family:"Noto Sans TC",sans-serif}
.card{position:relative;height:var(--h);width:calc(var(--h) * 9 / 16);flex:none;container-type:inline-size;background:#fff;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.15)}
.card img.art{position:absolute;inset:0;width:100%;height:100%}
.card .sdg{position:absolute;left:33.7%;top:30.93%;width:9.7%;height:3.23%;object-fit:contain;object-position:left center}
/* 版面座標來自 1080×1920 設計稿：x、y = 文字基線；字級 = 設計稿 px ÷ 1080 × 100cqw */
.t{position:absolute;white-space:nowrap;line-height:1;transform:translateY(-80%);color:#666;text-decoration:none;margin:0}
.lat{font-family:Barlow,"Noto Sans TC",sans-serif}
#name_zh{left:13.11%;top:50.28%;font-size:5.79cqw;letter-spacing:.11em;color:#000;font-weight:500}
#name_en{left:34.31%;top:50.77%;font-size:5.28cqw;letter-spacing:.11em;color:var(--coral);font-weight:700}
#title_zh{left:13.11%;top:56.19%;font-size:3.69cqw;letter-spacing:.11em;color:#474747}
#title_en{left:13.11%;top:58.92%;font-size:3.69cqw;letter-spacing:.07em}
#org{left:13.54%;top:83.18%;font-size:3.7cqw;letter-spacing:.11em;line-height:1.5;white-space:normal;transform:translateY(-1.05em)}
#site{left:13.54%;top:91.2%;font-size:3.7cqw;color:#797979;font-weight:700}
[hidden]{display:none!important}
.contacts{position:absolute;left:12.963%;top:66.901%;width:68%;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:1.267cqw;height:6.296cqw;color:#666;text-decoration:none;font:400 4.5cqw/1 Barlow,"Noto Sans TC",sans-serif;letter-spacing:.08em}
.row img{flex:none;width:4.63cqw;height:4.63cqw}
.row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:.1em}
.row:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
a.t:focus-visible,button:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.bar{display:flex;gap:8px;flex:none;height:var(--bar);width:calc(var(--h) * 9 / 16)}
button{flex:1;padding:0 6px;border-radius:999px;border:1.5px solid var(--coral);font:500 14px "Noto Sans TC",sans-serif;cursor:pointer}
#save{background:var(--coral);color:#fff}
#share,#saveimg{background:#fff;color:#222}
#qrbtn{position:absolute;flex:none;right:4cqw;top:4cqw;width:9.5cqw;height:9.5cqw;padding:1.6cqw;border-radius:8px;background:#fff;border:1.5px solid var(--coral)}
#qrbtn svg{display:block;width:100%;height:100%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:10}
.panel{position:relative;background:#fff;border-radius:16px;padding:20px;width:min(86vw,360px);max-height:90vh;overflow:auto;text-align:center;color:#222}
.panel h2{margin:0 0 12px;font-size:17px}
.panel img{width:100%;height:auto;display:block}
.panel p{margin:10px 0 0;font-size:13px;color:#666;word-break:break-all}
#mclose{position:absolute;flex:none;top:6px;right:6px;width:36px;height:36px;padding:0;border-radius:50%;border:0;background:#eee;font-size:20px}
#status{color:#666;font-size:15px;margin:0}
</style>
<script>
window.addEventListener('error', function (e) {
  var p = document.createElement('pre');
  p.style.cssText = 'white-space:pre-wrap;font:12px monospace;color:#b00;background:#fff;padding:8px;margin:0 0 8px;width:100%;max-width:480px';
  p.textContent = '載入失敗：' + e.message;
  (document.body || document.documentElement).prepend(p);
});
</script>
</head>
<body>
<p id="status">載入中…</p>
<main class="card" hidden>
  <img class="art" id="art" alt="名片">
  <button id="qrbtn" aria-label="顯示 QR Code"><svg viewBox="0 0 24 24" fill="#f6816c" aria-hidden="true"><path fill-rule="evenodd" d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm10-2h2v2h-2zm4 0h2v4h-4v-2h2zm-4 4h2v2h-2zm4 2h2v2h-2zm-2-2h2v2h-2z"/></svg></button>
  <img class="sdg" id="sdg" alt="SUSTAINABLE DEVELOPMENT GOALS" onerror="this.hidden=true">
  <div class="contacts" id="contacts">
    <a class="row" id="row_phone"><img id="ico_phone" alt=""><span id="phone"></span></a>
    <a class="row" id="row_line" target="_blank" rel="noopener"><img id="ico_line" alt=""><span id="line"></span></a>
    <a class="row" id="row_email"><img id="ico_email" alt=""><span id="email"></span></a>
    <a class="row" id="row_linkedin" target="_blank" rel="noopener"><img id="ico_linkedin" alt=""><span id="linkedin"></span></a>
  </div>
  <p class="t" id="name_zh"></p>
  <p class="t lat" id="name_en"></p>
  <p class="t" id="title_zh"></p>
  <p class="t lat" id="title_en"></p>
  <p class="t" id="org"></p>
  <p class="t lat" id="site"></p>
</main>
<div class="bar" hidden>
  <button id="save">加入通訊錄</button>
  <button id="saveimg">儲存名片</button>
  <button id="share">分享名片</button>
</div>
<div id="modal" hidden><div class="panel"><button id="mclose" aria-label="關閉">×</button><h2 id="mtitle"></h2><div id="mbody"></div><p id="mnote"></p></div></div>
<script>
// ===== 設定 =====
const API_URL = 'https://script.google.com/macros/s/AKfycby0nMPhIO5_58hJlb7QVjGw7oadfE5z9A7wy5GPaqm3_r7OxrKA77BulSJ8xSJ7EEsS7Q/exec'; // Apps Script 部署網址（結尾 /exec）；網址改變時只改這一行
const SHARE_BASE = 'https://card.tgeca.org';
const ART = '/assets/art.svg', ICON_PHONE = '/assets/icon-phone.svg', ICON_LINE = '/assets/icon-line.svg',
      ICON_EMAIL = '/assets/icon-email.svg', ICON_LINKEDIN = '/assets/icon-linkedin.svg';
const $ = id => document.getElementById(id);

// ===== 讀取資料：優先 fetch，失敗時改用 JSONP =====
function getId() {
  const q = new URLSearchParams(location.search).get('id');
  if (q) return q.trim();
  const seg = location.pathname.replace(/^\/+|\/+$/g, '');
  return seg && !/\.html?$/i.test(seg) ? decodeURIComponent(seg) : '';
}
function jsonp(id) {
  return new Promise((res, rej) => {
    const cb = 'cb' + Date.now(), s = document.createElement('script');
    window[cb] = d => { res(d); s.remove(); delete window[cb]; };
    s.onerror = () => rej(new Error('無法連線到資料來源'));
    s.src = API_URL + '?id=' + encodeURIComponent(id) + '&callback=' + cb;
    document.head.append(s);
  });
}
async function loadCard(id) {
  try { return await (await fetch(API_URL + '?id=' + encodeURIComponent(id))).json(); }
  catch (e) { return jsonp(id); }
}
(async () => {
  const id = getId();
  if (!id) { $('status').textContent = '缺少名片代碼，網址請使用 ?id=名片代碼'; return; }
  try {
    const d = await loadCard(id);
    if (!d || !d.ok) { $('status').textContent = '找不到這張名片，請確認網址中的 id 是否正確。'; return; }
    init(d.card, d.org);
  } catch (e) { $('status').textContent = '載入失敗：' + e.message; }
})();

function init(card, org) {
const pageUrl = SHARE_BASE + '/?id=' + encodeURIComponent(card.id);

// 永續發展目標 Logo：建議下載後改放 Google 雲端硬碟或嵌入，避免外部連結失效
const SDG_URL = "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/95/SustainableDevelopmentGoalsLogo.svg/500px-SustainableDevelopmentGoalsLogo.svg.png?utm_source=zh.wikipedia.org&utm_campaign=parser&utm_content=thumbnail";
['name_zh','name_en','title_zh','title_en'].forEach(k => $(k).textContent = card[k]);
$('phone').textContent = card.phone; $('row_phone').href = 'tel:' + card.phone.replace(/[^\d+]/g, '');
$('line').textContent = card.line; $('row_line').href = 'https://line.me/ti/p/~' + encodeURIComponent(card.line);
$('email').textContent = card.email; $('row_email').href = 'mailto:' + card.email;
// LinkedIn：可填完整網址、linkedin.com/in/xxx 或只填帳號 xxx
const liRaw = card.linkedin;
const liPath = liRaw.replace(/^https?:\/\/(www\.)?linkedin\.com\//i, '').replace(/^(www\.)?linkedin\.com\//i, '').replace(/\/+$/, '');
$('linkedin').textContent = /^(in|company)\//i.test(liPath) ? liPath : 'in/' + liPath;
$('row_linkedin').href = /^https?:\/\//i.test(liRaw) ? liRaw : 'https://www.linkedin.com/' + (/^(in|company)\//i.test(liPath) ? liPath : 'in/' + liPath);
['phone','line','email','linkedin'].forEach(k => { $('row_' + k).hidden = !card[k]; });
$('org').append(org.name + ' / 統編 ' + org.taxId, document.createElement('br'), org.address);
$('site').textContent = org.website;

function vcard() {
  const esc = s => String(s).replace(/([,;\\])/g, '\\$1');
  const L = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + esc(card.name_zh), 'N:' + esc(card.name_zh) + ';;;;',
    'ORG:' + esc(org.name), 'ADR;TYPE=WORK:;;' + esc(org.address) + ';;;;', 'URL:https://' + org.website];
  if (card.title_zh) L.push('TITLE:' + esc(card.title_zh));
  if (card.name_en) L.push('NICKNAME:' + esc(card.name_en));
  if (card.phone) L.push('TEL;TYPE=CELL:' + card.phone);
  if (card.email) L.push('EMAIL:' + card.email);
  if (card.linkedin) L.push('URL;TYPE=LinkedIn:' + $('row_linkedin').href);
  L.push('END:VCARD');
  return L.join('\r\n');
}
$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([vcard()], { type: 'text/vcard' }));
  a.download = card.name_zh + '.vcf';
  document.body.append(a); a.click(); a.remove();
};
$('share').onclick = async () => {
  try {
    if (navigator.share) await navigator.share({ title: card.name_zh + '的名片', url: pageUrl });
    else { await navigator.clipboard.writeText(pageUrl); $('share').textContent = '已複製連結'; }
  } catch (e) {}
};

$('ico_phone').src = ICON_PHONE; $('ico_line').src = ICON_LINE; $('ico_email').src = ICON_EMAIL; $('ico_linkedin').src = ICON_LINKEDIN;

$('art').src = ART; $('sdg').src = SDG_URL;

// ===== QR Code 與儲存名片圖片 =====
function openModal(title, node, note) {
  $('mtitle').textContent = title; $('mbody').replaceChildren(node || ''); $('mnote').textContent = note || '';
  $('modal').hidden = false;
}
$('mclose').onclick = () => $('modal').hidden = true;
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').hidden = true; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').hidden = true; });
$('qrbtn').onclick = () => {
  const img = new Image(); img.alt = '名片 QR Code';
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=480x480&margin=8&data=' + encodeURIComponent(pageUrl);
  img.onerror = () => $('mnote').textContent = 'QR Code 載入失敗，請檢查網路後再試。網址：' + pageUrl;
  openModal(card.name_zh + ' 的名片 QR Code', img, pageUrl);
};
async function renderCard() {
  const W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const load = (src, cors) => new Promise(res => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  const rows = [['phone', ICON_PHONE], ['line', ICON_LINE], ['email', ICON_EMAIL], ['linkedin', ICON_LINKEDIN]]
    .filter(([k]) => card[k]).map(([k, ic]) => [$(k).textContent, ic]);
  const all = [card.name_zh, card.name_en, card.title_zh, card.title_en, org.name, org.address, org.taxId, org.website, ...rows.map(r => r[0])].join('');
  await Promise.all([['500 62px "Noto Sans TC"', card.name_zh], ['400 40px "Noto Sans TC"', all], ['700 57px Barlow', all], ['400 48px Barlow', all]]
    .map(([f, t]) => document.fonts.load(f, t).catch(() => {})));
  const [art, sdg, ...icons] = await Promise.all([load(ART), load(SDG_URL, true), ...rows.map(r => load(r[1]))]);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  if (art) g.drawImage(art, 0, 0, W, H);
  if (sdg) { const s = Math.min(104.8 / sdg.width, 62 / sdg.height); g.drawImage(sdg, 364.06, 593.97 + (62 - sdg.height * s) / 2, sdg.width * s, sdg.height * s); }
  const ZH = '"Noto Sans TC", sans-serif', LAT = 'Barlow, "Noto Sans TC", sans-serif';
  const T = (txt, x, y, font, color, sp, base) => {
    g.font = font; g.fillStyle = color; g.textBaseline = base || 'alphabetic';
    for (const ch of txt) { g.fillText(ch, x, y); x += g.measureText(ch).width + sp; }
  };
  T(card.name_zh, 141.6, 965.4, '500 62.5px ' + ZH, '#000', 62.5 * .11);
  T(card.name_en, 370.5, 974.8, '700 57px ' + LAT, '#f6816c', 57 * .11);
  T(card.title_zh, 141.6, 1078.8, '400 39.9px ' + ZH, '#474747', 39.9 * .11);
  T(card.title_en, 141.6, 1131.3, '400 39.9px ' + LAT, '#666', 39.9 * .07);
  rows.forEach(([txt], i) => {
    const top = 1284.5 + i * 68;
    if (icons[i]) g.drawImage(icons[i], 140, top + 9, 50, 50);
    T(txt, 203.7, top + 34, '400 48.6px ' + LAT, '#666', 48.6 * .08, 'middle');
  });
  T(org.name + ' / 統編 ' + org.taxId, 146.2, 1597, '400 40px ' + ZH, '#666', 40 * .11);
  T(org.address, 146.2, 1657, '400 40px ' + ZH, '#666', 40 * .11);
  T(org.website, 146.2, 1751, '700 40px ' + LAT, '#797979', 0);
  return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('無法輸出圖片')), 'image/png'));
}
$('saveimg').onclick = async () => {
  const btn = $('saveimg'); btn.disabled = true; btn.textContent = '產生中…';
  try {
    const url = URL.createObjectURL(await renderCard());
    const a = document.createElement('a'); a.href = url; a.download = card.name_zh + '-名片.png';
    document.body.append(a); a.click(); a.remove();
    const img = new Image(); img.src = url; img.alt = '名片圖片';
    openModal('名片圖片', img, '若沒有自動下載，請長按圖片選擇「儲存圖片」。');
  } catch (e) { openModal('儲存失敗', null, e.message); }
  btn.disabled = false; btn.textContent = '儲存名片';
};

$('status').hidden = true; document.querySelector('.card').hidden = false; document.querySelector('.bar').hidden = false;
document.title = card.name_zh + '｜' + org.name;

}
</script>
</body>
</html>
